<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Retro Drift — Open index.html in Chrome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div id="hud">
      <div id="speed">0 km/h</div>
      <div id="drift">DRIFT: 0</div>
      <div id="lap">Lap: 0</div>
      <div id="time">00:00.000</div>
    </div>
    <div id="hint">WASD / Arrows to drive — Space to handbrake — R to reset</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
